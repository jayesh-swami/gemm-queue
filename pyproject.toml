[project]
name = "gemm-queue"
version = "0.1.0"
description = "Job queue that runs and verifies custom AMD HIP GEMM kernels on generated matrices"
readme = "README.md"
authors = [
    { name = "Jayesh", email = "jayeshjayant99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.2.2",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]  # generated by alembic
force-exclude = true  # also when pre-commit passes the file names explicitly

[tool.ruff.lint]
# On top of the defaults: import sorting, modern syntax, likely bugs
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.isort]
# The repo's alembic/ folder would otherwise make ruff treat the alembic package as ours
known-third-party = ["alembic"]
