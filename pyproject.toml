[project]
name = "gemm-queue"
version = "0.1.0"
description = "Job queue that runs and verifies custom AMD HIP GEMM kernels on uploaded or generated matrices"
readme = "README.md"
authors = [
    { name = "Jayesh", email = "jayeshjayant99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gemm-queue = "gemm_queue:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
