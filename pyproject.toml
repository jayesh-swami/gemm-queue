[project]
name = "gemm-queue"
version = "0.1.0"
description = "Job queue that runs and verifies custom AMD HIP GEMM kernels on generated matrices"
readme = "README.md"
authors = [
    { name = "Jayesh", email = "jayeshjayant99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
