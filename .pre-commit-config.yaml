# Install once with `uv run pre-commit install`; `make lint` runs every hook on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  # Local hooks use the versions pinned in uv.lock and package-lock.json.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: oxlint
        name: oxlint (frontend)
        entry: npm run --prefix gemm_queue/frontend lint
        language: system
        files: ^gemm_queue/frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
