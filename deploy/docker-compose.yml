# Run through the Makefile (make up / db / mq / down), which sets the project directory.
name: gemm-queue

services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data:Z
    healthcheck:
      # $$ so compose leaves the variables for the container's shell
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mq:
    image: rabbitmq:4-management
    # RabbitMQ names its data directory after the node's hostname, so it must
    # stay fixed or durable queues and messages are lost on recreate.
    hostname: gemmq-mq
    # Run as the image's rabbitmq user. Otherwise the healthcheck (exec'd as
    # root) can create /var/lib/rabbitmq/.erlang.cookie as root before the
    # broker does, and the broker then can't read its own cookie.
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI
    volumes:
      # named volume: podman gives it the image's ownership (uid 999), which a
      # rootless bind mount of a host dir would not have
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # built by `make api`: compose's own build step fails on the unreadable .pgdata
    image: localhost/gemm-queue-api
    env_file: .env
    environment:
      POSTGRES_HOST: db
      RABBITMQ_HOST: mq
      WEB_CONCURRENCY: ${API_PROCESSES:-1}  # uvicorn processes; make up API_PROCESSES=N
    ports:
      - "127.0.0.1:8000:8000"   # API and frontend
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
    healthcheck:  # GET /ready: Postgres and RabbitMQ reachable
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sweeper:
    # Batch job: re-publishes or fails runs whose result never came back.
    # Same image as the API; it reads the same database.
    image: localhost/gemm-queue-api
    command: ["uv", "run", "--no-sync", "python", "-m", "gemm_queue.batch.sweeper"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      RABBITMQ_HOST: mq
      PUSHGATEWAY_URL: pushgateway:9091
      INSTANCE_NAME: sweeper
      # make test-chaos shortens these; normally 10 min and 60 s
      SWEEPER_STUCK_AFTER_S: ${SWEEPER_STUCK_AFTER_S:-600}
      SWEEPER_INTERVAL_S: ${SWEEPER_INTERVAL_S:-60}
    depends_on:
      api:  # applies the migrations on start
        condition: service_healthy
      pushgateway:
        condition: service_started
    restart: unless-stopped

  results:
    # Saves the workers' results into Postgres. Its own service, so it scales apart
    # from the API (make results RESULTS=N). Same image as the API.
    image: localhost/gemm-queue-api
    command: ["uv", "run", "--no-sync", "python", "-m", "gemm_queue.results"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      RABBITMQ_HOST: mq
      PUSHGATEWAY_URL: pushgateway:9091
    depends_on:
      api:  # applies the migrations on start
        condition: service_healthy
      pushgateway:
        condition: service_started
    restart: unless-stopped

  worker:
    # built by `make worker`: compose's own build step fails on the unreadable .pgdata
    image: localhost/gemm-queue-worker
    env_file: .env
    environment:
      RABBITMQ_HOST: mq
      WORKER_RUNNER: ${WORKER_RUNNER:-hip}  # from .env, or RUNNER=... on the make command
      PUSHGATEWAY_URL: pushgateway:9091
    # the GPU: kfd is the compute interface, dri holds the render node
    devices:
      - /dev/kfd
      - /dev/dri
    depends_on:
      mq:
        condition: service_healthy
      pushgateway:
        condition: service_started
    restart: unless-stopped

  # --- Monitoring: Prometheus pulls from the API, RabbitMQ, the Pushgateway and the
  # Postgres exporter; Grafana shows it.

  pushgateway:  # the workers, results consumers and sweeper push their metrics here
    image: docker.io/prom/pushgateway:v1.11.5
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped

  postgres-exporter:  # reads Postgres's statistics views and exposes them as metrics
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - promdata:/prometheus
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # view without logging in (localhost only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gemm-queue.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mqdata:
  promdata:
