global:
  scrape_interval: 5s  # short, so the dashboard follows the workload closely

scrape_configs:
  - job_name: api  # pull: FastAPI serves /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: pushgateway  # worker and sweeper push here
    honor_labels: true  # keep their job/instance labels instead of "pushgateway"
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: rabbitmq  # built-in plugin; the detailed endpoint has per-queue numbers
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["mq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
